# Configuration for MCMulT training on CMU-MOSI

# Data settings
data_path: './data/mosi'
max_seq_len: 50

# Model architecture
audio_dim: 74
visual_dim: 35
text_dim: 300
d_model: 128
nhead: 8
num_layers: 4
dropout: 0.1

# Training settings
batch_size: 32
num_epochs: 100
learning_rate: 0.0001
weight_decay: 0.01
grad_clip: 1.0
optimizer: 'adamw'
scheduler: 'cosine'
step_size: 10
gamma: 0.5

# Data loading
num_workers: 4

# Logging and checkpointing
log_dir: './logs'
checkpoint_dir: './checkpoints'
log_interval: 10
save_interval: 10
resume_checkpoint: null

# Reproducibility
seed: 42

# Performance targets
# Target CCC: 0.68-0.72
# Multi-GPU speedup: 10-50x with distributed training

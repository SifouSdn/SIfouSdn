# ==========================================
# Tips for Hyperparameter Tuning
# ==========================================
# 
# Model Architecture:
# - d_model: [64, 128, 256, 512] - larger = more capacity but slower
# - nhead: [4, 8, 16] - must divide d_model evenly
# - num_layers: [2, 4, 6, 8] - more layers = deeper model
# - dropout: [0.1, 0.2, 0.3] - higher for larger models to prevent overfitting
#
# Training:
# - batch_size: [8, 16, 32, 64] - larger = faster but more memory
# - learning_rate: [0.0001, 0.0005, 0.001] - lower for fine-tuning
# - weight_decay: [0.0, 0.01, 0.1] - regularization strength
# - grad_clip: [0.5, 1.0, 5.0] - prevents gradient explosion
#
# Optimization:
# - optimizer: 'adam' or 'adamw' (adamw recommended)
# - scheduler: 'cosine' (smooth decay) or 'step' (periodic decay)
#
# For multi-GPU training:
# - Scale learning rate linearly with number of GPUs
# - Increase batch size proportionally
# - Ensure batch_size is divisible by number of GPUs
